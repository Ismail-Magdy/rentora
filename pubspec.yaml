name: rentora
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  skeletonizer: ^2.1.3
  flutter_offline: ^6.0.0
  internet_connection_checker_plus: ^3.1.0
  cached_network_image: ^3.4.1
  lottie: ^3.3.3
  image_cropper: ^12.2.1
  flutter_svg: ^2.3.0

  # State Management
  flutter_bloc: ^9.1.1

  # Dependency Injection
  get_it: ^9.2.1

  # Local Storage (Caching)
  shared_preferences: ^2.5.5

  # Secure Data
  flutter_secure_storage: ^9.0.0
  flutter_dotenv: ^6.0.1

  # FireBase & Social Media
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  google_sign_in: ^6.3.0

  # Splash Screen & App Icon
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  cloudinary_public: ^0.23.1

  # Networking
  dio: ^5.11.0
  dartz: ^0.10.1

  # Location & Maps
  flutter_map: ^8.3.1
  geocoding: ^4.0.0
  latlong2: ^0.10.1
  geolocator: ^14.0.2
  dart_geohash: ^2.1.0
  table_calendar: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svgs/logo/
    - assets/svgs/categories/
    - assets/svgs/root/
    - assets/svgs/home/
    - assets/icons/
    - assets/lottie/

  # Custom Fonts
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Italic-VariableFont_wght.ttf
        - asset: assets/fonts/Montserrat-VariableFont_wght.ttf

    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
# App Icon Configuration (Must be at Root Level)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon-launcher.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/play-store-icon-launcher.png"
